name: GTA VI police six star identification short
on:
  push:
    branches: [gta6-policia-seis-estrelas-v3]
    paths:
      - 'mundo-vivo/**'
      - '.github/workflows/gta6-police-sixstars.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mundo-vivo/**'
      - '.github/workflows/gta6-police-sixstars.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mundo-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip
          npx remotion browser ensure
      - name: Download verified GTA VI police stills and Pricedown
        run: |
          python -m pip install requests --break-system-packages -q
          python assets.py
          curl -fLsS --retry 3 'https://dl.dafont.com/dl/?f=pricedown' -o pricedown.zip
          unzip -po pricedown.zip 'Pricedown Bl.otf' > public/pricedown.otf
          test -s public/pricedown.otf
          for f in city night beach birds boats characters swamp; do test -s "public/$f.jpg"; done
      - name: Create Brazilian narration and original soundtrack
        run: |
          node music.cjs
          python -m pip install edge-tts --break-system-packages -q
          python voice.py
      - name: Validate revised six star composition
        run: npx remotion compositions src/index.jsx
      - name: Export 35-second 60-fps MP4
        run: npx remotion render src/index.jsx GTAVIWorld gta6-policia-seis-estrelas.mp4 --codec h264 --concurrency 2 --log error --timeout 180000
      - name: Validate audio and visuals
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json gta6-policia-seis-estrelas.mp4
          ffmpeg -hide_banner -i gta6-policia-seis-estrelas.mp4 -map 0:a:0 -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume'
          test -s gta6-policia-seis-estrelas.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: gta6-policia-seis-estrelas-mp4
          path: mundo-vivo/gta6-policia-seis-estrelas.mp4
          retention-days: 7
      - name: Publish direct MP4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gta6-policia-6-estrelas-2026 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload gta6-policia-6-estrelas-2026 gta6-policia-seis-estrelas.mp4 --repo ${{ github.repository }} --clobber
          else
            gh release create gta6-policia-6-estrelas-2026 gta6-policia-seis-estrelas.mp4 --repo ${{ github.repository }} --target gta6-policia-seis-estrelas-v3 --title 'GTA VI - 6 estrelas e identificação policial' --notes '35s 60FPS Remotion. Seis estrelas, testemunhas, carro, roupas, rosto e companheiro. Fonte Pricedown, narração brasileira e música original.'
          fi
