name: Render 10 GTA VI Trailer 2 details
on:
  push:
    branches: [gta6-trailer-10-detalhes]
    paths:
      - 'detail-video/**'
      - '.github/workflows/render-gta6-details.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: detail-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion tools
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg
          npx remotion browser ensure
      - name: Obtain source frames from Rockstar Trailer 2
        run: |
          mkdir -p public
          python assets.py
          curl -fLsS --retry 3 'https://dl.dafont.com/dl/?f=pricedown' -o pricedown.zip
          unzip -po pricedown.zip 'Pricedown Bl.otf' > public/pricedown.otf
          test -s public/pricedown.otf
          for n in {0..9}; do test -s "public/scene$n.webp" || exit 1; done
          ls -lh public/
      - name: Create soundtrack and Brazilian narration
        run: |
          node music.cjs
          python -m pip install edge-tts --break-system-packages
          python voice.py
          test -s public/voice.wav
      - name: Check composition
        run: npx remotion compositions src/index.jsx
      - name: Render 30s Remotion MP4, 60FPS
        run: npx remotion render src/index.jsx GTA6Detalhes gta6-10-detalhes-trailer.mp4 --codec h264 --concurrency 2 --log error --timeout 180000
      - name: Verify video and voice audio
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json gta6-10-detalhes-trailer.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 gta6-10-detalhes-trailer.mp4
          ffmpeg -hide_banner -i gta6-10-detalhes-trailer.mp4 -map 0:a:0 -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume'
      - name: Upload MP4 file
        uses: actions/upload-artifact@v4
        with:
          name: gta6-10-detalhes-mp4
          path: detail-video/gta6-10-detalhes-trailer.mp4
          retention-days: 7
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gta6-10-detalhes-trailer-2026 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload gta6-10-detalhes-trailer-2026 gta6-10-detalhes-trailer.mp4 --repo ${{ github.repository }} --clobber
          else
            gh release create gta6-10-detalhes-trailer-2026 gta6-10-detalhes-trailer.mp4 --repo ${{ github.repository }} --target gta6-trailer-10-detalhes --title 'GTA VI: 10 detalhes do trailer 2' --notes 'Video Remotion de 30s em 9:16, 60 FPS, com Pricedown, narracao PT-BR, trilha original e quadros reais extraidos do Trailer 2. Montagem de analise; frames da Rockstar Games.'
          fi
