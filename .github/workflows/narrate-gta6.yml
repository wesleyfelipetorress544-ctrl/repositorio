name: Add narration to GTA VI video
on:
  push:
    branches: [gta6-video-remotion]
    paths:
      - 'gta-video/narration.py'
      - '.github/workflows/narrate-gta6.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download existing final MP4 - keep every visual frame unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gta-video
          gh run download 43744333182 --repo ${{ github.repository }} --name gta6-valor-minimo-mp4 --dir gta-video
          mv gta-video/gta6-valor-minimo.mp4 gta-video/source.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 gta-video/source.mp4
      - name: Install voice synthesizer
        run: |
          python -m pip install edge-tts --break-system-packages
      - name: Add male Brazilian Portuguese voiceover and duck the existing music
        working-directory: gta-video
        run: python narration.py
      - name: Confirm output was generated
        run: |
          test -s gta-video/gta6-valor-minimo-narrado.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json gta-video/gta6-valor-minimo-narrado.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of json gta-video/gta6-valor-minimo-narrado.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: gta6-valor-minimo-narrado
          path: gta-video/gta6-valor-minimo-narrado.mp4
          retention-days: 7
      - name: Publish as a new release, preserving the original version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gta6-xbox-ps5-narrado-2026 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload gta6-xbox-ps5-narrado-2026 gta-video/gta6-valor-minimo-narrado.mp4 --repo ${{ github.repository }} --clobber
          else
            gh release create gta6-xbox-ps5-narrado-2026 gta-video/gta6-valor-minimo-narrado.mp4 --repo ${{ github.repository }} --target gta6-video-remotion --title 'GTA VI - Comparativo com narracao PT-BR' --notes 'Mesma edicao Remotion, com narracao masculina em portugues brasileiro e musica original reduzida durante a fala.'
          fi
