name: Inspect TikTok reference photo post
on:
  push:
    branches: [gta6-tiktok-photo-reference-2026]
    paths: ['tiktok-reference/probe.py','.github/workflows/probe-tiktok-photo.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get TikTok image carousel metadata
        run: |
          python -m pip install yt-dlp requests --break-system-packages -q
          python tiktok-reference/probe.py
