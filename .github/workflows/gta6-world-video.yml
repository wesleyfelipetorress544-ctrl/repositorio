name: Render GTA VI vibrant open world short
on:
  push:
    branches: [gta6-mundo-vivo-remotion-2026]
    paths:
      - 'mundo-vivo/**'
      - '.github/workflows/gta6-world-video.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mundo-vivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion and FFmpeg
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip
          npx remotion browser ensure
      - name: Download real GTA VI media and Pricedown
        run: |
          python -m pip install requests --break-system-packages -q
          python assets.py
          curl -fLsS --retry 3 'https://dl.dafont.com/dl/?f=pricedown' -o pricedown.zip
          unzip -po pricedown.zip 'Pricedown Bl.otf' > public/pricedown.otf
          test -s public/pricedown.otf
          ls -lh public/
      - name: Create synchronized Brazilian narration and music
        run: |
          node music.cjs
          python -m pip install edge-tts --break-system-packages -q
          python voice.py
      - name: Validate Remotion composition
        run: npx remotion compositions src/index.jsx
      - name: Export 35 second vertical 60 fps MP4
        run: npx remotion render src/index.jsx GTAVIWorld gta6-mundo-mais-vivo.mp4 --codec h264 --concurrency 2 --log error --timeout 180000
      - name: Verify picture and spoken audio
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json gta6-mundo-mais-vivo.mp4
          ffmpeg -hide_banner -i gta6-mundo-mais-vivo.mp4 -map 0:a:0 -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume'
          test -s gta6-mundo-mais-vivo.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: gta6-mundo-mais-vivo-mp4
          path: mundo-vivo/gta6-mundo-mais-vivo.mp4
          retention-days: 7
      - name: Publish direct video download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gta6-mundo-vivo-video-2026 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload gta6-mundo-vivo-video-2026 gta6-mundo-mais-vivo.mp4 --repo ${{ github.repository }} --clobber
          else
            gh release create gta6-mundo-vivo-video-2026 gta6-mundo-mais-vivo.mp4 --repo ${{ github.repository }} --target gta6-mundo-vivo-remotion-2026 --title 'GTA VI - O mundo aberto mais vivo?' --notes '35s vertical 60fps Remotion with real Rockstar GTA VI imagery, original music, Pricedown typography, synchronized Brazilian Portuguese narration. Observations are based on released materials; mechanics are not asserted.'
          fi
