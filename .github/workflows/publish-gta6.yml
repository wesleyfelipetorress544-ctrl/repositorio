name: Publish GTA VI MP4 with narration
on:
  push:
    branches: [gta6-video-remotion]
    paths:
      - '.github/workflows/publish-gta6.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-gta6.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing final Remotion video (preserve all visuals)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gta-video
          gh run download 43744333182 --repo ${{ github.repository }} --name gta6-valor-minimo-mp4 --dir gta-video
          mv gta-video/gta6-valor-minimo.mp4 gta-video/source.mp4
          test -s gta-video/source.mp4
      - name: Install FFmpeg for audio-only muxing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -1
      - name: Install token-free PT-BR voice synthesizer
        run: python -m pip install edge-tts --break-system-packages
      - name: Add narration to the existing video only
        working-directory: gta-video
        run: python narration.py
      - name: Validate narrated video
        run: |
          test -s gta-video/gta6-valor-minimo-narrado.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 gta-video/gta6-valor-minimo-narrado.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: gta6-valor-minimo-narrado
          path: gta-video/gta6-valor-minimo-narrado.mp4
          retention-days: 7
      - name: Publish new narrated MP4 download (old file unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gta6-xbox-ps5-narrado-2026 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload gta6-xbox-ps5-narrado-2026 gta-video/gta6-valor-minimo-narrado.mp4 --repo ${{ github.repository }} --clobber
          else
            gh release create gta6-xbox-ps5-narrado-2026 gta-video/gta6-valor-minimo-narrado.mp4 --repo ${{ github.repository }} --target gta6-video-remotion --title 'GTA VI - Comparativo com narracao PT-BR' --notes 'Mesmo video anterior, com apenas narracao masculina brasileira adicionada.'
          fi
