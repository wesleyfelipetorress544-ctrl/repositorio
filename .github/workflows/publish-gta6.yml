name: Publish GTA VI MP4 direct download
on:
  push:
    branches: [gta6-video-remotion]
    paths:
      - '.github/workflows/publish-gta6.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-gta6.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch already-rendered MP4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 43744333182 --repo ${{ github.repository }} --name gta6-valor-minimo-mp4 --dir release
          ls -lah release/
          test -s release/gta6-valor-minimo.mp4
      - name: Publish direct MP4 download as GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create gta6-xbox-ps5-precos-2026 release/gta6-valor-minimo.mp4 --repo ${{ github.repository }} --target gta6-video-remotion --title 'GTA VI - Xbox Series S vs PS5 Digital' --notes 'Video GTA VI PS5 e Xbox: fotos reais dos consoles e comparativo de preços. Remotion 30 segundos, 60 FPS. Trilha instrumental original.'
